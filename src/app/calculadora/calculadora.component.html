<div class="container"> 
    <div class="form-box">
        <form (ngSubmit)="soma()">
            <h2>Calculadora</h2>
            <label for="numero1">Primeiro Número:</label>
            <input type="number" name="numero1" id="numero1" [(ngModel)] = "numero1"/>

            <label for="numero2">Segundo Número:</label>
            <input type="number" name="numero2" id="numero2" [(ngModel)] = "numero2"/>

            <button class="btn-primary" type="submit">Somar</button>

            @if (mostrarResultado()) {
                <div class="result-display">
                    <p>Resultado: <span> {{ resultado() }} </span></p>
                </div>
            }
        </form>
    </div>
</div>
